name: iOS Screenshots

# Génère des captures d'écran App Store de Moed depuis un simulateur iOS, piloté
# de bout en bout par CI (aucun Mac local, aucun compte de test) :
#   1. build simulateur (.app) via XcodeGen + xcodebuild
#   2. boot d'un iPhone 6.9" (1320×2868), langue forcée FR, status bar figée 9:41
#   3. navigation des 5 onglets + capture via Maestro (.maestro/screenshots.yaml)
#   4. vérif des dimensions, publication en artefact
#   5. (optionnel) push sur la fiche App Store Connect via fastlane deliver
#
# Rien n'est buildé pour un device réel, rien n'est soumis à la review.
# Le push ASC est gardé derrière l'input `push_asc` (défaut: false) pour pouvoir
# d'abord vérifier les captures en artefact.

on:
  workflow_dispatch:
    inputs:
      push_asc:
        description: "Pousser les captures sur App Store Connect (fastlane deliver)"
        type: boolean
        default: false

env:
  SCHEME: Moed
  XCODEPROJ: Moed.xcodeproj
  BUNDLE_ID: com.wizycode.moed
  LOCALE_DIR: fr-FR

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Java (requis par Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode (le plus récent dispo)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Xcode sélectionné: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Générer le projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
          test -d "$XCODEPROJ" || { echo "::error::$XCODEPROJ non généré"; exit 1; }

      - name: Build pour le simulateur (signature désactivée)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath dd \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="dd/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          test -d "$APP_PATH" || { echo "::error::$APP_PATH introuvable après build"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Créer/booter un iPhone 6.9" (Pro Max, 1320×2868)
        run: |
          set -euo pipefail
          pick_udid() {
            xcrun simctl list devices available | grep -F "$1" | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1
          }
          UDID=$(pick_udid "iPhone 16 Pro Max")
          [ -z "$UDID" ] && UDID=$(pick_udid "Pro Max")
          if [ -z "$UDID" ]; then
            echo "Aucun Pro Max dispo — création."
            RUNTIME=$(xcrun simctl list runtimes ios available | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
            DEVTYPE=$(xcrun simctl list devicetypes | grep -Eo 'com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9]+-Pro-Max' | sort -V | tail -1)
            [ -n "$RUNTIME" ] && [ -n "$DEVTYPE" ] || { echo "::error::Création simulateur Pro Max impossible"; exit 1; }
            UDID=$(xcrun simctl create "shot-promax" "$DEVTYPE" "$RUNTIME")
          fi
          echo "Simulateur: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || sleep 20

      - name: Forcer la langue FR au niveau du simulateur (reboot pour appliquer)
        run: |
          set -euo pipefail
          # lang = settings.lang ?? Lang.fromSystem() -> forcer la langue système suffit.
          xcrun simctl spawn "$SIM_UDID" defaults write .GlobalPreferences AppleLanguages -array fr
          xcrun simctl spawn "$SIM_UDID" defaults write .GlobalPreferences AppleLocale -string fr_FR
          xcrun simctl shutdown "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b || sleep 20

      - name: Status bar propre (9:41, plein signal, batterie pleine)
        run: |
          xcrun simctl status_bar "$SIM_UDID" override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || echo "status_bar override best-effort"

      - name: Installer l'app + installer Maestro
        run: |
          set -euo pipefail
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capturer les 5 écrans (Maestro)
        run: |
          set -euo pipefail
          OUT="$PWD/fastlane/screenshots/$LOCALE_DIR"
          rm -rf "$OUT"; mkdir -p "$OUT"
          # Le driver XCUITest de Maestro se compile/installe à froid (parfois >2min)
          # -> timeout large + 1 retry pour absorber la flakiness "driver not ready".
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
          # Chemin ABSOLU passé en paramètre (Maestro ne résout pas les chemins
          # relatifs de takeScreenshot depuis le CWD). Maestro cible le sim booté.
          maestro test -e OUT="$OUT" .maestro/screenshots.yaml \
            || { echo "::warning::1er essai Maestro KO, retry"; sleep 15; \
                 maestro test -e OUT="$OUT" .maestro/screenshots.yaml; }
          # Filet de sécurité : si rien n'a atterri dans OUT, rapatrier les PNG
          # récents trouvés dans le workspace ou ~/.maestro.
          if ! ls "$OUT"/*.png >/dev/null 2>&1; then
            echo "::warning::Aucun PNG dans $OUT — recherche ailleurs"
            find "$PWD" "$HOME/.maestro" -name '0[1-5]_*.png' -type f 2>/dev/null \
              -exec mv -f {} "$OUT/" \; || true
          fi
          echo "--- Captures produites ---"
          ls -la "$OUT"
          test -n "$(ls -A "$OUT"/*.png 2>/dev/null)" || { echo "::error::aucune capture générée"; exit 1; }
          echo "--- Dimensions ---"
          for f in "$OUT"/*.png; do
            sips -g pixelWidth -g pixelHeight "$f" | tr '\n' ' '; echo " <- $(basename "$f")"
          done

      - name: Publier les captures en artefact (toujours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: fastlane/screenshots/**
          if-no-files-found: warn

      - name: Pousser sur App Store Connect (fastlane deliver)
        if: ${{ inputs.push_asc }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios screenshots
