# project.yml — génération du projet Xcode via XcodeGen (PLAN.md §9).
# Le .xcodeproj n'est PAS commité : la CI le régénère (`xcodegen generate`).
#
# Cibles :
#   • Moed         — application SwiftUI (iOS 17+)
#   • MoedTests    — tests unitaires + validation halakhique (matrice 10 villes × 2 ans)
#
# NB v1 : l'extension WidgetKit (MoedWidgets) est RETIRÉE du build (frictions de
# signature). Ses sources restent sur disque (Sources/MoedWidgets/) mais ne sont
# compilées par aucune cible ; à rebrancher plus tard. Le code partagé
# (Sources/Shared : Engine/, Data/, tokens) reste compilé dans la seule cible Moed.
#
# Aucune dépendance SPM runtime : le calcul solaire/halakhique est 100 % natif
# (Swift pur, algorithme NOAA porté de KosherJava dans Engine/SolarCalculator.swift)
# — parité stricte avec kosher-zmanim / KosherJava, validée hors-ligne contre la
# fixture (Sources/MoedTests/Fixtures/kosher_zmanim_reference.json).

name: Moed

options:
  bundleIdPrefix: com.wizycode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: fr          # région de base ; localisations he/fr/en (Info.plist + *.lproj)

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # Numéro de build injecté par la CI : xcodebuild résout $(BUILD_NUMBER) depuis
    # l'environnement (workflow → github.run_number, exporté dans $GITHUB_ENV).
    # Remplace increment_build_number. NE PAS définir BUILD_NUMBER ici : une valeur
    # projet écraserait la variable d'environnement (précédence Xcode). En local
    # (BUILD_NUMBER absent) CFBundleVersion est vide — sans impact sur un build Debug.
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    # Équipe de signature injectée par la CI (secret TEAM_ID → env). Vide en local.
    # Le Fastfile réécrit aussi DEVELOPMENT_TEAM via update_code_signing_settings.
    DEVELOPMENT_TEAM: "$(TEAM_ID)"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=300"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"   # iPhone uniquement (pas de captures iPad requises en v1)

targets:

  # ─────────────────────────────────────────────────────────────
  # Application
  # ─────────────────────────────────────────────────────────────
  Moed:
    type: application
    platform: iOS
    sources:
      - path: Sources/Moed
      - path: Sources/Shared      # Engine + Data + tokens partagés (widget retiré en v1)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizycode.moed
        INFOPLIST_FILE: Sources/Moed/App/Info.plist
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone uniquement — forcé au niveau target (le réglage projet ne suffisait pas à l'archive)

  # ─────────────────────────────────────────────────────────────
  # Extension WidgetKit (MoedWidgets) — RETIRÉE en v1 (frictions de signature).
  # Les sources restent sur disque dans Sources/MoedWidgets/ mais ne sont
  # compilées par AUCUNE cible. À rebrancher plus tard.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Tests (dont validation halakhique bloquante)
  # ─────────────────────────────────────────────────────────────
  MoedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/MoedTests   # tests + validation halakhique + fixture figé (bundlé)
    dependencies:
      - target: Moed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizycode.moed.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Moed:
    build:
      targets:
        Moed: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MoedTests
    archive:
      config: Release
