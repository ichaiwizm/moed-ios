# Flow Maestro — captures App Store de Moed sur simulateur iOS.
# Navigue vers 5 écrans FORTS et capture chacun. La langue (FR) et la status bar
# (9:41) sont posées AU NIVEAU DU SIMULATEUR par le workflow avant ce flow.
# Les onglets/cartes sont tapés par leur libellé FR visible (accessibilityLabel),
# stable et sans dépendre d'accessibilityIdentifier (peu fiable sur une TabBar SwiftUI).
# On évite l'onglet Personnel (état vide au 1er lancement -> mauvaise vitrine) au
# profit d'un détail de tsadik (biographie, écran riche).
appId: com.wizycode.moed
---
- launchApp
- waitForAnimationToEnd:
    timeout: 9000
- takeScreenshot: ${OUT}/01_aujourdhui

- tapOn:
    text: "Tsadikim"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/02_tsadikim

# Ouvre la fiche d'un tsadik (nom mono-mot, tap fiable) -> biographie sourcée.
- tapOn:
    text: "Maïmonide"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/03_tsadik_detail

- tapOn:
    text: "Calendrier"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/04_calendrier

- tapOn:
    text: "Réglages"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/05_reglages
